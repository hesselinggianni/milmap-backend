# Per-directory PHP overrides honored by PHP-FPM / CGI / LiteSpeed SAPIs.
# (On those SAPIs the .htaccess `php_value` lines and a stray `php.ini` are
#  ignored — `.user.ini` is the file PHP actually reads here.) Without this,
# the host default upload_max_filesize (often 2M) rejects phone photos before
# Laravel runs, surfacing as the implicit "validation.uploaded" error.
upload_max_filesize = 100M
post_max_size = 120M
memory_limit = 256M
